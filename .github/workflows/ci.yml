name: Publish NuGet (GitHub Release)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to pack'
        required: true
jobs:
  build:
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        include-prerelease: true
    - name: Compute version from tag
      id: ver
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"          
        VERSION="${TAG#v}"                
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Checkout
      uses: actions/checkout@v2
    - name: Build
      run: dotnet build --configuration Release
    - name: Test
      run: dotnet test --configuration Release --no-build
    - name: Pack
      run: dotnet pack -c Release --no-build -p:PackageVersion=${{ steps.ver.outputs.version || github.event.inputs.version }} --output ./artifacts
    - name: Push
      run: dotnet nuget push "*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${NUGET_KEY}
      if: github.ref_name == 'main'
      env:
        NUGET_KEY: ${{ secrets.NUGET_KEY }}